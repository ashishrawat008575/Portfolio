    content="Explore Ashish's web development portfolio showcasing React and JavaScript projects." />
  <meta name="twitter:image" content="https://rawat-portfolio.vercel.app/twitter-preview.png" />

  <script>
    const fullTitle = "✦ Welcome to My_Portfolio ✦";

    let index = 0;
    let isDeleting = false;

    function typeTitle() {
      let currentTitle = fullTitle.slice(0, index);
      document.title = currentTitle;

      if (!isDeleting) {
        if (index < fullTitle.length) {
          index++;
        } else {
          isDeleting = true;
          setTimeout(typeTitle, 2000);
          return;
        }
      } else {
        if (index > 0) {
          index--;
        } else {
          isDeleting = false;
        }
      }

      setTimeout(typeTitle, isDeleting ? 100 : 150);
    }

    window.addEventListener("DOMContentLoaded", typeTitle);
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
